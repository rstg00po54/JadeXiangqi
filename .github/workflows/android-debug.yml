name: Build Jade Xiangqi Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found in $ANDROID_HOME"; exit 1; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test pure Java rules
        run: bash scripts/test_core.sh
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JadeXiangqi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
